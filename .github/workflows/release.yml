name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create
      id-token: write  # npm Trusted Publishing (OIDC), no token needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm >= 11.5.1 (Node 24 ships npm 11).
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g pnpm@9 --quiet
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm test && pnpm build

      # Authenticated by the OIDC token GitHub issues to this workflow, which
      # npmjs.com trusts for @pawpayments/sdk (package settings → Trusted
      # Publisher: pawpayments/node-sdk, release.yml). Provenance is attached
      # automatically.
      - run: npm publish --access public

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
